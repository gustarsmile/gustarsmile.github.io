<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蔬米 OMILKYWAY｜經典互動作品</title>
  <meta name="description" content="蔬米 OMILKYWAY 的經典互動作品：太上感應篇、十善業道經互動電子書，以及地獄遊記、天堂遊記網頁遊戲。免費、免下載，手機打開就能讀。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="蔬米 OMILKYWAY｜經典互動作品">
  <meta property="og:url" content="https://edu.omilkyway.org/">
  <meta property="og:locale" content="zh_TW">
  <meta name="theme-color" content="#1b1f52">
  <style>
    :root { color-scheme: light dark; --bg: #f7f3ea; --ink: #2a2520; --muted: #6b6258; --card: #fffdf8; --line: #e2d9c8; --accent: #8a3b1e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17182b; --ink: #f1ece2; --muted: #b3ab9e; --card: #22243d; --line: #383b5c; --accent: #f0b46a; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Serif TC", "PMingLiU", "Songti TC", serif; line-height: 1.7; }
    main { max-width: 40rem; margin: 0 auto; padding: 2.5rem 1rem 3rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: .05em; }
    p.lead { color: var(--muted); margin: 0 0 2rem; }
    h2 { font-size: 1rem; color: var(--muted); font-weight: normal; margin: 2rem 0 .5rem; letter-spacing: .1em; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: .75rem; }
    a.work { display: block; padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--line); border-radius: .6rem; color: inherit; text-decoration: none; }
    a.work:hover, a.work:focus-visible { border-color: var(--accent); }
    a.work strong { display: block; font-size: 1.15rem; color: var(--accent); }
    a.work span { color: var(--muted); font-size: .95rem; }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: .95rem; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>經典互動作品</h1>
    <p class="lead">蔬米 OMILKYWAY 把傳統的勸善經典做成可以點、可以讀、可以玩的網頁。免費、免下載，手機打開就能看。</p>

    <h2>互動電子書</h2>
    <ul>
      <li><a class="work" href="/taishang-ganying-pian/"><strong>太上感應篇</strong><span>全文 1,277 字的原文、白話、註解與朗讀，點亮 112 盞燈</span></a></li>
      <li><a class="work" href="/ten-virtues-sutra/"><strong>十善業道經</strong><span>佛陀在海底的龍宮，為龍王講了十件事：原文、白話、註解與朗讀</span></a></li>
    </ul>

    <h2>互動遊戲</h2>
    <ul>
      <li><a class="work" href="/hell-tour-game/"><strong>幽冥之旅：地獄遊記</strong><span>當一回見習判官：聽供詞、照孽鏡、斷因果</span></a></li>
      <li><a class="work" href="/hell-tour-family/"><strong>地獄遊記・親子共讀版</strong><span>乘蓮台遊天堂、隨濟公訪地府，回來看看你的花樹</span></a></li>
      <li><a class="work" href="/heaven-tour-game/"><strong>天堂遊記</strong><span>跟著濟公遊天堂，看看掛著你名字的那棵樹長成什麼樣</span></a></li>
    </ul>

    <footer>更多文章與介紹：<a href="https://omilkyway.org/">omilkyway.org</a></footer>
  </main>
</body>
</html>
